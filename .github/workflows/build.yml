name: Shaxmat APK
on:
  workflow_dispatch:
  push:
    paths: ["shashka_android.zip"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: ZIP ni ochish
        run: unzip -q shashka_android.zip -d proj
      - name: Stockfish yasash
        run: |
          git clone https://github.com/official-stockfish/Stockfish.git sf
          cd sf && git checkout ff7cee4244ec96ea488c402669e3674c0574dce6
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd src
          make net
          make -j4 build ARCH=armv8-dotprod COMP=ndk || make -j4 build ARCH=armv8 COMP=ndk
          mkdir -p ../../proj/android/app/src/main/jniLibs/arm64-v8a
          cp stockfish ../../proj/android/app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APK yasash
        working-directory: proj/android
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: shaxmat-bot-apk
          path: proj/android/app/build/outputs/apk/debug/app-debug.apk
